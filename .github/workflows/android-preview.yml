name: Build Parsigram APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/android-preview.yml]

permissions:
  contents: write

concurrency:
  group: parsigram-android-preview
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v13.2.2-parsigram.2
      APK_NAME: Parsigram-13.2.2-preview2-arm64-v8a.apk
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android tools
        run: |
          sdk="$RUNNER_TEMP/parsigram-android-sdk"
          archive="$RUNNER_TEMP/parsigram-commandline-tools.zip"
          mkdir -p "$sdk/cmdline-tools"
          curl --fail --silent --show-error --location --retry 3 \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o "$archive"
          unzip -q "$archive" -d "$sdk/cmdline-tools"
          mv "$sdk/cmdline-tools/cmdline-tools" "$sdk/cmdline-tools/latest"
          export ANDROID_HOME="$sdk" ANDROID_SDK_ROOT="$sdk"
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk" "$sdk" >> "$GITHUB_ENV"
          sdkmanager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          (set +o pipefail; yes | "$sdkmanager" --sdk_root="$sdk" --licenses >/dev/null)
          "$sdkmanager" --sdk_root="$sdk" 'platform-tools' 'platforms;android-36' \
            'build-tools;35.0.0' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Build the arm64 standalone APK
        run: |
          cat > "$RUNNER_TEMP/arm64.init.gradle" <<'GRADLE'
          gradle.beforeProject { project ->
              if (project.path == ':TMessagesProj_AppStandalone') {
                  project.pluginManager.withPlugin('com.android.application') {
                      project.extensions.getByName('androidComponents').finalizeDsl { android ->
                          def afat = android.productFlavors.getByName('afat')
                          afat.ndk.abiFilters.clear()
                          afat.ndk.abiFilters.add('arm64-v8a')
                          android.packaging.jniLibs.excludes.addAll([
                              '**/armeabi-v7a/*.so', '**/x86/*.so', '**/x86_64/*.so'
                          ])
                      }
                  }
              }
          }
          GRADLE
          ./gradlew -I "$RUNNER_TEMP/arm64.init.gradle" --no-daemon --max-workers=4 \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8" \
            -Pkotlin.compiler.execution.strategy=in-process -Pandroid.injected.build.abi=arm64-v8a \
            -Pandroid.injected.testOnly=false \
            :TMessagesProj_AppStandalone:assembleAfatStandalone
      - name: Sign and verify the preview APK
        run: |
          umask 077
          openssl rand -hex 32 > "$RUNNER_TEMP/parsigram-preview.pass"
          keytool -genkeypair -storetype PKCS12 -keystore "$RUNNER_TEMP/parsigram-preview.p12" \
            -storepass:file "$RUNNER_TEMP/parsigram-preview.pass" -alias parsigram-preview \
            -keyalg RSA -keysize 4096 -validity 10000 -dname 'CN=Parsigram Preview'
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          apk="$APK_NAME"
          input=$(find TMessagesProj_AppStandalone/build/intermediates/apk/afat/standalone -name '*.apk' -type f)
          test -f "$input"
          "$build_tools/apksigner" sign --ks "$RUNNER_TEMP/parsigram-preview.p12" \
            --ks-pass "file:$RUNNER_TEMP/parsigram-preview.pass" --ks-key-alias parsigram-preview --out "$apk" "$input"
          "$build_tools/apksigner" verify "$apk"
          "$build_tools/apksigner" verify --min-sdk-version 31 --max-sdk-version 31 "$apk"
          "$build_tools/zipalign" -c -P 16 4 "$apk"
          "$build_tools/aapt2" dump badging "$apk" > "$RUNNER_TEMP/parsigram-badging.txt"
          grep -F "package: name='Parsigram.dezhcode.app'" "$RUNNER_TEMP/parsigram-badging.txt"
          grep -Fx "native-code: 'arm64-v8a'" "$RUNNER_TEMP/parsigram-badging.txt"
          "$build_tools/aapt2" dump xmltree "$apk" --file AndroidManifest.xml > "$RUNNER_TEMP/parsigram-manifest.txt"
          if grep -Eq 'android:testOnly\([^)]*\)=true' "$RUNNER_TEMP/parsigram-manifest.txt"; then
            echo "::error::The APK is marked testOnly and cannot be installed normally."
            exit 1
          fi
          unzip -tq "$apk"
      - name: Save the verified APK
        uses: actions/upload-artifact@v4
        with:
          name: parsigram-preview2-arm64-v8a
          path: ${{ env.APK_NAME }}
          if-no-files-found: error
          compression-level: 0
      - name: Publish the verified APK
        run: |
          apk="$APK_NAME"
          digest=$(sha256sum "$apk" | cut -d ' ' -f 1)
          printf '%s\n\n%s\n\n%s\n' \
            'نسخهٔ آزمایشی دوم پارسی‌گرام 13.2.2 برای دستگاه‌های اندرویدی arm64-v8a. مشکل نصب از طریق فایل APK در نسخهٔ قبلی برطرف شده است.' \
            'شناسهٔ بسته `Parsigram.dezhcode.app` است. ورود به حساب تلگرام روی دستگاه تست نشده است.' \
            "SHA-256: \`$digest\`" > "$RUNNER_TEMP/parsigram-release-notes.md"
          for attempt in 1 2 3 4; do
            if timeout 30s gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets |
              jq -e --arg apk "$apk" '.isDraft == false and any(.assets[]; .name == $apk and .state == "uploaded")' >/dev/null; then
              echo 'The release already has the APK.'
              exit 0
            fi

            if timeout 90s gh release create "$RELEASE_TAG" "$apk" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title 'Parsigram 13.2.2 · نسخهٔ آزمایشی دوم' --prerelease --notes-file "$RUNNER_TEMP/parsigram-release-notes.md"; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              sleep "$((attempt * 10))"
            fi
          done

          echo '::error::GitHub Release publication failed. Download the verified APK from the workflow artifacts.'
          exit 1
